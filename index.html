<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palmon Season 3 Map Divider</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; padding: 20px; }
        h2 { text-align: center; color: #ffd700; margin-bottom: 5px; }
        .instructions { text-align: center; color: #aaa; margin-bottom: 20px; font-size: 14px; }
        .controls { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; }
        .btn { padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-none { background: #333; color: #fff; }
        .btn-g1 { background: #008080; color: #fff; } /* Teal */
        .btn-g2 { background: #4a0e4e; color: #fff; } /* Dark Purple */
        .btn-g3 { background: #ffd700; color: #000; } /* Yellow */
        .grid-container { 
            display: grid; 
            grid-template-columns: repeat(4, 120px) 60px repeat(4, 120px); 
            grid-template-rows: repeat(4, 120px) 60px repeat(4, 120px); 
            gap: 4px; 
            justify-content: center; 
            background: #222; 
            padding: 10px; 
            border-radius: 8px; 
            max-width: fit-content; 
            margin: 0 auto;
        }
        .zone { 
            background: #2a2a2a; 
            border: 1px solid #444; 
            border-radius: 4px; 
            padding: 5px; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            cursor: pointer; 
            font-size: 11px; 
            transition: all 0.2s; 
            overflow: hidden;
        }
        .zone:hover { filter: brightness(1.3); border-color: #ffd700; }
        .zone-coord { font-weight: bold; color: #888; font-size: 10px; }
        .zone-name { color: #fff; font-weight: bold; margin: 4px 0; line-height: 1.2; }
        .zone-lvl { color: #ffd700; font-size: 10px; }
        .zone-occ { margin-top: auto; font-size: 9px; background: rgba(0,0,0,0.4); padding: 2px; border-radius: 2px; text-align: center; }
        
        /* Guild Selection Styles */
        .zone.guild-none { border-left: 4px solid #555; }
        .zone.guild-1 { background: #008080 !important; border-color: #00ced1; } /* Teal */
        .zone.guild-2 { background: #4a0e4e !important; border-color: #8a2be2; } /* Dark Purple */
        .zone.guild-3 { background: #b8860b !important; border-color: #ffd700; color: #fff !important; } /* Yellow */
        .temple { background: #581c87 !important; border: 2px solid #a855f7 !important; }
    </style>
</head>
<body>

    <h2>Palantis Season 3 Map Divider</h2>
    <div class="instructions">Select a guild color below, then click zones on the grid to assign territory.</div>

    <div class="controls">
        <button class="btn btn-none" onclick="selectGuild('none', event)">Eraser / Neutral</button>
        <button class="btn btn-g1" onclick="selectGuild('guild-1', event)">Eeveelutions (EVE)</button>
        <button class="btn btn-g2" onclick="selectGuild('guild-2', event)">DarkUnicorns (DGAF)</button>
        <button class="btn btn-g3" onclick="selectGuild('guild-3', event)">NARNIA (NAR)</button>
    </div>

    <div class="grid-container" id="mapGrid"></div>

    <script>
        let currentGuild = 'guild-1';
        
        function selectGuild(guild, event) {
            currentGuild = guild;
            document.querySelectorAll('.btn').forEach(b => b.style.outline = 'none');
            event.target.style.outline = '3px solid #fff';
        }

        // Exact raw data provided by user
        const rawMapData = [
            ["Level 1 Desert Ruins", "Level 1 Woodsong Shrine", "Level 1 Desert Ruins", "Level 2 Woodsong Shrine", "Level 1 Desert Ruins", "Level 1 Steelstory Shrine", "Level 1 Desert Ruins", "Level 2 Steelstory Shrine", "Level 1 Desert Ruins"],
            ["Level 2 Steelstory Shrine", "Level 2 Desert Ruins", "Level 3 Woodsong Shrine", "Level 2 Desert Ruins", "Level 3 Steelstory Shrine", "Level 2 Desert Ruins", "Level 3 Goldglade Shrine", "Level 2 Desert Ruins", "Level 1 Goldglade Shrine"],
            ["Level 1 Desert Ruins", "Level 3 Goldglade Shrine", "Level 3 Desert Ruins", "Level 4 Woodsong Shrine", "Level 3 Desert Ruins", "Level 4 Steelstory Shrine", "Level 3 Desert Ruins", "Level 3 Woodsong Shrine", "Level 1 Desert Ruins"],
            ["Level 1 Steelstory Shrine", "Level 2 Desert Ruins", "Level 4 Goldglade Shrine", "Level 5 Goldglade Shrine", "Level 6 Scholar Sacrarium", "Level 5 Woodsong Shrine", "Level 4 Goldglade Shrine", "Level 2 Desert Ruins", "Level 2 Goldglade Shrine"],
            ["Level 1 Desert Ruins", "Level 3 Steelstory Shrine", "Level 3 Desert Ruins", "Level 6 Crafstman Chancel", "Level 7 Temple", "Level 6 Armigo Altar", "Level 3 Desert Ruins", "Level 3 Steelstory Shrine", "Level 1 Desert Ruins"],
            ["Level 2 Woodsong Shrine", "Level 2 Desert Ruins", "Level 4 Steelstory Shrine", "Level 5 Woodsong Shrine", "Level 6 Scholar Sacrarium", "Level 5 Steelstory Shrine", "Level 4 Woodsong Shrine", "Level 2 Desert Ruins", "Level 1 Woodsong Shrine"],
            ["Level 1 Desert Ruins", "Level 3 Woodsong Shrine", "Level 3 Desert Ruins", "Level 4 Goldglade Shrine", "Level 3 Desert Ruins", "Level 4 Steelstory Shrine", "Level 3 Desert Ruins", "Level 3 Goldglade Shrine", "Level 1 Desert Ruins"],
            ["Level 1 Woodsong Shrine", "Level 2 Desert Ruins", "Level 3 Goldglade Shrine", "Level 2 Desert Ruins", "Level 3 Steelstory Shrine", "Level 2 Desert Ruins", "Level 3 Woodsong Shrine", "Level 2 Desert Ruins", "Level 1 Woodsong Shrine"],
            ["Level 1 Desert Ruins", "Level 2 Goldglade Shrine", "Level 1 Desert Ruins", "Level 1 Goldglade Shrine", "Level 1 Desert Ruins", "Level 2 Steelstory Shrine", "Level 1 Desert Ruins", "Level 1 Steelstory Shrine", "Level 1 Desert Ruins"]
        ];

        const container = document.getElementById('mapGrid');

        // Loop through 9 rows and 9 columns to generate the exact grid layout
        for (let r = 0; r < 9; r++) {
            for (let c = 0; c < 9; c++) {
                const zoneDiv = document.createElement('div');
                zoneDiv.className = 'zone guild-none';
                
                // Track if it belongs to row 5 or col 5 (+ sign 100 tile format)
                if (r === 4 && c === 4) {
                    zoneDiv.classList.add('temple');
                }

                const rawText = rawMapData[r][c];
                // Clean split to extract text vs level
                const levelIndex = rawText.indexOf("Level");
                const name = levelIndex > 0 ? rawText.substring(0, levelIndex).replace(/- \$/, '').trim() : rawText.replace(/^Level \d+ /, '');
                const lvlMatch = rawText.match(/Level \d+/);
                const lvl = lvlMatch ? lvlMatch[0] : "";

                zoneDiv.innerHTML = `
                    <div class="zone-coord">[R${r+1}, C${c+1}]</div>
                    <div class="zone-name">${name}</div>
                    <div class="zone-lvl">${lvl}</div>
                    <div class="zone-occ" id="occ-${r}-${c}">Occupier: None</div>
                `;

                // Handle interactive clicking to paint zones
                zoneDiv.addEventListener('click', function() {
                    zoneDiv.className = 'zone'; // clear existing guild classes
                    if (r === 4 && c === 4) zoneDiv.classList.add('temple');
                    
                    const occLabel = document.getElementById(`occ-${r}-${c}`);
                    
                    if (currentGuild === 'none') {
                        zoneDiv.classList.add('guild-none');
                        occLabel.innerText = "Occupier: None";
                    } else if (currentGuild === 'guild-1') {
                        zoneDiv.classList.add('guild-1');
                        occLabel.innerText = "Occupier: EVE";
                    } else if (currentGuild === 'guild-2') {
                        zoneDiv.classList.add('guild-2');
                        occLabel.innerText = "Occupier: DGAF";
                    } else if (currentGuild === 'guild-3') {
                        zoneDiv.classList.add('guild-3');
                        occLabel.innerText = "Occupier: NAR";
                    }
                });

                container.appendChild(zoneDiv);
            }
        }
    </script>
</body>
</html>
